catalogVersion: 2026-08-31
apps:
  - id: edutrack
    displayName: EduTrack Platform
    runtimeVariableCount: 90
  - id: ops
    displayName: Ops Console
    runtimeVariableCount: 47
  - id: website
    displayName: Thien Uy Website
    runtimeVariableCount: 0
consumers:
  - id: edutrack.web
    appId: edutrack
    kind: service
    displayName: EduTrack web runtime
  - id: edutrack.scheduled_jobs
    appId: edutrack
    kind: job
    displayName: EduTrack scheduled jobs
  - id: edutrack.public_build
    appId: edutrack
    kind: build
    displayName: EduTrack public Vite build
  - id: ops.api
    appId: ops
    kind: service
    displayName: Ops API
  - id: ops.web
    appId: ops
    kind: service
    displayName: Ops web
  - id: ops.collector
    appId: ops
    kind: service
    displayName: Ops collector
  - id: ops.sql_worker
    appId: ops
    kind: service
    displayName: Ops SQL worker
  - id: ops.notifier
    appId: ops
    kind: service
    displayName: Ops notifier
  - id: ops.processor
    appId: ops
    kind: service
    displayName: Ops processor
  - id: ops.migrate
    appId: ops
    kind: service
    displayName: Ops migrate
precedences:
  - id: edutrack.shared_env_runtime
    rank: 200
    scope: runtime
    description: Active shared Node env file
  - id: edutrack.shared_env_build
    rank: 200
    scope: build
    description: Active shared Vite build env file
  - id: edutrack.pm2_runtime
    rank: 300
    scope: runtime
    description: Active PM2 env object overrides shared env
  - id: ops.runtime_env
    rank: 200
    scope: runtime
    description: Root-managed systemd environment file
validators:
  - id: postgres_url
    type: url
    allowedSchemes: [postgres, postgresql]
  - id: https_url
    type: url
    allowedSchemes: [https]
  - id: loopback_http_url
    type: regex
    pattern: "^http://127\\.0\\.0\\.1(?::[0-9]{2,5})?(?:/.*)?$"
  - id: absolute_path
    type: regex
    pattern: "^/"
  - id: release_sha
    type: regex
    pattern: "^[a-f0-9]{40}$"
  - id: boolean_string
    type: enum
    allowedValues: ["true", "false"]
  - id: non_empty
    type: non_empty
  - id: credential_reference
    type: regex
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"
  - id: positive_integer
    type: integer
    minimum: 1
