limit_req_zone $binary_remote_addr zone=ops_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name man.thienuy.edu.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
