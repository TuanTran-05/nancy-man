server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose the application over plaintext while the certificate is pending.
    location / {
        return 503;
    }
}
