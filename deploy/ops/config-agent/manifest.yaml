actions:
  - id: application.clear_apply_block
    description: Clear a blocked application after owner-approved remediation.
    executable: /usr/bin/systemctl
    args: [reset-failed]
    timeoutMs: 10000
  - id: job.next_run
    description: Record that a next-job variable takes effect at the next scheduled run.
    timeoutMs: 1000
  - id: pm2.reload_app
    description: Reload the manifest-pinned PM2 application.
    executable: /usr/bin/pm2
    args: [reload, edutrack]
    timeoutMs: 30000
  - id: release.build_redeploy
    description: Build and activate a configuration-derived release through pinned tooling.
    executable: /usr/bin/bash
    args: [/srv/edutrack/current/deploy/vps/prepare-platform-release.sh]
    workingDirectory: /srv/edutrack
    timeoutMs: 300000
  - id: systemd.reload_unit
    description: Reload a manifest-pinned systemd unit.
    executable: /usr/bin/systemctl
    args: [reload, edutrack-ops-api.service]
    timeoutMs: 30000
  - id: systemd.restart_unit
    description: Restart a manifest-pinned systemd unit.
    executable: /usr/bin/systemctl
    args: [restart, edutrack-ops-api.service]
    timeoutMs: 30000
checks:
  - id: agent.healthy
    description: Verify the configuration agent protocol and loaded catalog are healthy.
    timeoutMs: 5000
  - id: dependency.probe
    description: Run a manifest-pinned dependency probe with bounded output.
    timeoutMs: 5000
  - id: http.readiness_local
    description: Verify the fixed local readiness endpoint.
    host: 127.0.0.1
    port: 3100
    path: healthz
    timeoutMs: 5000
  - id: http.smoke_public
    description: Verify the fixed public HTTPS smoke endpoint.
    host: man.thienuy.edu.vn
    port: 443
    path: healthz
    timeoutMs: 10000
  - id: process.active
    description: Verify the manifest-pinned service process is active and stable.
    timeoutMs: 5000
  - id: release.identity
    description: Verify source, release, and configuration identity.
    timeoutMs: 5000
