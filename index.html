<!doctype html>
<html lang="en">
  <head>
    <meta name="zalo-platform-site-verification" content="OFY3DuNl11DlcQH4bx8dPdAjabAUsqSDEJWn" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EduTrack - Hệ thống quản lý giáo dục thông minh. Theo dõi điểm danh, bài tập, và tiến độ học tập của học sinh."
    />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Nunito:wght@400;500;600;700;800;900&family=Outfit:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="EduTrack - Smart Learning System" />
    <meta
      property="og:description"
      content="Hệ thống quản lý giáo dục thông minh. Theo dõi điểm danh, bài tập, và tiến độ học tập."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://i.postimg.cc/5NPyBH5z/8f924ba5-ebef-4ae7-837e-808057d68243.png"
    />
    <title>EduTrack - Smart Learning System</title>
    <link
      rel="shortcut icon"
      href="https://i.postimg.cc/5NPyBH5z/8f924ba5-ebef-4ae7-837e-808057d68243.png"
      type="image/x-icon"
    />
    <style>
      :root {
        --brand-blue: #3b82f6;
        --slate-50: #f0f4f8;
        --slate-900: #0f172a;
        --slate-500: #64748b;
        --loading-bg: rgba(240, 244, 248, 0.8);
        --loading-title: #0f172a;
        --loading-text: #64748b;
        --loading-icon-bg: #ffffff;
        --loading-icon-border: #e2e8f0;
      }
      :root.dark {
        --slate-50: #0f172a;
        --slate-900: #f1f5f9;
        --slate-500: #94a3b8;
        --loading-bg: rgba(15, 23, 42, 0.8);
        --loading-title: #f1f5f9;
        --loading-text: #94a3b8;
        --loading-icon-bg: #1e293b;
        --loading-icon-border: #334155;
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.5;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.5;
        }
      }
      @keyframes bounce-dot {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: var(--loading-bg);
        font-family:
          'DM Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .logo-pulse {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        animation: pulse-ring 2s infinite ease-in-out;
      }
      .logo-pulse img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .app-name {
        font-size: 2rem;
        font-weight: 800;
        color: var(--loading-title);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      .loading-text {
        font-size: 1rem;
        color: var(--loading-text);
        margin-bottom: 24px;
        font-weight: 500;
      }
      .dots-container {
        display: flex;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        background-color: var(--brand-blue);
        border-radius: 50%;
        animation: bounce-dot 0.6s infinite ease-in-out;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
    </style>
  </head>
  <body>
    <script>
      // Apply dark class synchronously before first paint to avoid white flash
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      body {
        background-color: var(--loading-bg);
      }
    </style>
    <div id="root">
      <div class="loading-container">
        <div class="logo-pulse">
          <img
            src="https://i.postimg.cc/5NPyBH5z/8f924ba5-ebef-4ae7-837e-808057d68243.png"
            alt="Thiên Uy English Center Logo"
          />
        </div>
        <div class="app-name">EduTrack</div>
        <div class="loading-text">Đang tải ứng dụng</div>
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div
          id="error-display"
          style="
            color: #ef4444;
            font-size: 13px;
            max-width: 320px;
            text-align: center;
            margin-top: 32px;
            font-weight: 500;
          "
        ></div>
      </div>
    </div>
    <script>
      window.onerror = function (msg, url, line, col, error) {
        var display = document.getElementById('error-display');
        if (display) {
          display.textContent = 'Lỗi khởi động: ' + msg + ' (Dòng ' + line + ')';
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
